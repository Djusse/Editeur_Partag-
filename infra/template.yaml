AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Éditeur de documents partagé — une instance EC2 (Node.js : Fastify + ws + Yjs)
  derrière nginx, DynamoDB, S3 privé, SQS + file de lettres mortes, SES et
  SSM Parameter Store. Région imposée par le compte : eu-north-1 (Stockholm).

Metadata:
  Projet: editeur-documents-partage
  Proprietaire: Djusse Tameno Christian

Parameters:
  KeyName:
    Type: String
    Default: ''
    Description: >
      Paire de clés SSH existante. Laisser vide pour n'utiliser que
      Session Manager (recommandé : aucune clé à protéger).
  AdminCidr:
    Type: String
    Default: ''
    Description: >
      Plage autorisée pour SSH (port 22), p. ex. votre IP en /32. Vide ou
      0.0.0.0/0 = port 22 FERMÉ (accès par Session Manager uniquement).
  InstanceType:
    Type: String
    Default: m7i-flex.large
    AllowedValues:
      - m7i-flex.large
      - t3.micro
      - t3.small
      - t3.medium
      - t3.large
      - t3.xlarge
    Description: >
      m7i-flex.large (2 vCPU / 8 Gio) est **éligible au Free Tier** tout en
      offrant la mémoire du plan v7 pour C5 (12 000 connexions) : c'est le choix
      par défaut. Les t3.* restent acceptés ; t3.large et au-delà ne sont pas
      éligibles au Free Tier et échouent sur un compte neuf. Voir
      infra/README-infra.md, section « Free Tier ».
  SesSenderEmail:
    Type: String
    Description: Adresse expéditrice vérifiée dans SES (Gmail vérifié).
  CreditPerDay:
    Type: Number
    Default: 10000
  MaxUpdateBytes:
    Type: Number
    Default: 65536
  BatchMs:
    Type: Number
    Default: 300
  TickMs:
    Type: Number
    Default: 250

Conditions:
  HasKey: !Not [!Equals [!Ref KeyName, '']]
  OpenSsh: !And
    - !Not [!Equals [!Ref AdminCidr, '']]
    - !Not [!Equals [!Ref AdminCidr, '0.0.0.0/0']]

  # `CreditSpecification` n'est accepté que par les familles **burstable**
  # (t2 / t3 / t4g). L'envoyer pour `m7i-flex.large`, qui ne l'est pas, fait
  # échouer la création de l'instance avec `InvalidParameterCombination`.
  IsBurstable: !Or
    - !Equals [!Ref InstanceType, 't3.micro']
    - !Equals [!Ref InstanceType, 't3.small']
    - !Equals [!Ref InstanceType, 't3.medium']
    - !Equals [!Ref InstanceType, 't3.large']
    - !Equals [!Ref InstanceType, 't3.xlarge']

Resources:

  # ---------------------------------------------------------------------------
  # Stockage objet : PDF, snapshots, versions, artefacts de déploiement
  # ---------------------------------------------------------------------------
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub 'editeur-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-artefacts
            Status: Enabled
            Prefix: artifacts/
            ExpirationInDays: 7
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: expire-pdf
            Status: Enabled
            Prefix: pdf/
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
      Tags:
        - { Key: Projet, Value: editeur-documents-partage }

  # Refuse tout trafic non HTTPS (accès public déjà bloqué, ceinture et bretelles)
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt Bucket.Arn
              - !Sub '${Bucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # ---------------------------------------------------------------------------
  # Tables DynamoDB (mode à la demande)
  # ---------------------------------------------------------------------------
  DocumentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: docId, AttributeType: S }
      KeySchema:
        - { AttributeName: docId, KeyType: HASH }
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  MembersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: docId, AttributeType: S }
        - { AttributeName: email, AttributeType: S }
      KeySchema:
        - { AttributeName: docId, KeyType: HASH }
        - { AttributeName: email, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - { AttributeName: email, KeyType: HASH }
          Projection: { ProjectionType: ALL }
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  UpdatesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: docId, AttributeType: S }
        - { AttributeName: seq, AttributeType: N }
      KeySchema:
        - { AttributeName: docId, KeyType: HASH }
        - { AttributeName: seq, KeyType: RANGE }
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  CreditsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  OpIdsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  AbuseTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  LinksTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: token, AttributeType: S }
        - { AttributeName: docId, AttributeType: S }
      KeySchema:
        - { AttributeName: token, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: docId-index
          KeySchema:
            - { AttributeName: docId, KeyType: HASH }
          Projection: { ProjectionType: ALL }
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  TicketsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: token, AttributeType: S }
        - { AttributeName: visitorId, AttributeType: S }
      KeySchema:
        - { AttributeName: token, KeyType: HASH }
        - { AttributeName: visitorId, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  PdfCacheTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  VersionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: docId, AttributeType: S }
        - { AttributeName: n, AttributeType: N }
      KeySchema:
        - { AttributeName: docId, KeyType: HASH }
        - { AttributeName: n, KeyType: RANGE }
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  # ---------------------------------------------------------------------------
  # File SQS des PDF + file de lettres mortes
  # ---------------------------------------------------------------------------
  PdfDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: editeur-pdf-dlq
      MessageRetentionPeriod: 1209600
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  PdfQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: editeur-pdf
      # Un consommateur lent ne doit pas être tué trop vite : la génération d'un
      # gros PDF peut prendre plusieurs dizaines de secondes.
      VisibilityTimeout: 120
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PdfDeadLetterQueue.Arn
        maxReceiveCount: 3
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  # Les secrets (`/editeur/jwt-secret`, `/editeur/admin-key`) ne sont **pas**
  # créés par ce template : `scripts/deploy.sh` les génère avec `openssl rand`
  # puis les écrit en `SecureString`. Ils n'existent donc ni dans le dépôt, ni
  # dans l'historique CloudFormation, ni dans le user data.

  # ---------------------------------------------------------------------------
  # Réseau : Security Group, rôle d'instance
  # ---------------------------------------------------------------------------
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Editeur documents partage - HTTP public, SSH uniquement si AdminCidr
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP (REST et WebSocket)
        - !If
          - OpenSsh
          - IpProtocol: tcp
            FromPort: 22
            ToPort: 22
            CidrIp: !Ref AdminCidr
            Description: SSH limite
          - !Ref AWS::NoValue
      # Sortie : règle par défaut (tout autorisé) pour DynamoDB, S3, SQS, SES, SSM
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: editeur-moindre-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DynamoDB
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  # `ConditionCheckItem` est l'action réellement évaluée pour un
                  # `ConditionCheck` dans `TransactWriteItems`. Il n'existe pas
                  # d'action IAM nommée `dynamodb:TransactWriteItems` : c'est
                  # l'avertissement de `cfn-lint`, et une transaction refusée
                  # aurait fait échouer toutes les écritures groupées du hub.
                  - dynamodb:ConditionCheckItem
                Resource:
                  - !GetAtt DocumentsTable.Arn
                  - !GetAtt MembersTable.Arn
                  - !Sub '${MembersTable.Arn}/index/*'
                  - !GetAtt UpdatesTable.Arn
                  - !GetAtt CreditsTable.Arn
                  - !GetAtt OpIdsTable.Arn
                  - !GetAtt AbuseTable.Arn
                  - !GetAtt LinksTable.Arn
                  - !Sub '${LinksTable.Arn}/index/*'
                  - !GetAtt TicketsTable.Arn
                  - !GetAtt PdfCacheTable.Arn
                  - !GetAtt VersionsTable.Arn
              - Sid: S3ListBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
              - Sid: S3Objects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${Bucket.Arn}/*'
              - Sid: SQS
                Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueAttributes
                Resource:
                  - !GetAtt PdfQueue.Arn
                  - !GetAtt PdfDeadLetterQueue.Arn
              - Sid: SSEmail
                Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'
                Condition:
                  StringEquals:
                    ses:FromAddress: !Ref SesSenderEmail
              - Sid: SSMParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/editeur/*'
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/editeur/*'
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # ---------------------------------------------------------------------------
  # Instance applicative
  # ---------------------------------------------------------------------------
  Instance:
    Type: AWS::EC2::Instance
    # Pas de secret dans le user data : il est lisible via les métadonnées.
    # Les secrets vivent dans SSM et sont lus par le rôle d'instance.
    #
    # La pile n'est déclarée « terminée » que si le user data a réussi : le
    # script appelle `cfn-signal` sur son code de sortie. En contrepartie, tout
    # échec provoque un rollback **et la suppression de l'instance** ; pour
    # déboguer, créer la pile avec `--disable-rollback`.
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT25M
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      InstanceType: !Ref InstanceType
      KeyName: !If [HasKey, !Ref KeyName, !Ref AWS::NoValue]
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!Ref SecurityGroup]
      Monitoring: true
      MetadataOptions:
        HttpTokens: required
        # 1 : le SDK AWS (et SSM) parlent directement à IMDS, aucun conteneur
        # intermédiaire ne justifie un second saut.
        HttpPutResponseHopLimit: 1
        HttpEndpoint: enabled
      # Crédits CPU en mode Standard : uniquement pour les burstable, dont le
      # mode `unlimited` peut facturer des dépassements. Sans objet ailleurs.
      CreditSpecification: !If
        - IsBurstable
        - CPUCredits: standard
        - !Ref AWS::NoValue
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Pas de `set -e` : on veut **tout tenter** et rapporter un bilan
          # détaillé, plutôt que d'abandonner sur la première commande qui
          # échoue sans laisser de trace exploitable.
          set -uxo pipefail

          # Journal lisible même après le rollback (l'instance est alors détruite).
          exec > >(tee -a /var/log/editeur-init.log) 2>&1

          STEP="initialisation"
          step() { STEP="$1"; echo "=== ETAPE : $STEP ==="; }

          # `cfn-signal` appartient au paquet `aws-cfn-bootstrap`, **absent
          # d'AL2023**. On l'installe avant tout le reste pour pouvoir rapporter
          # un échec, quel qu'il soit.
          if ! dnf install -y aws-cfn-bootstrap; then
            echo "ERREUR FATALE : aws-cfn-bootstrap introuvable"
            /opt/aws/bin/cfn-signal -e 1 --reason "aws-cfn-bootstrap introuvable" \
              --stack ${AWS::StackName} --resource Instance --region ${AWS::Region} || true
            exit 1
          fi

          # Signale le résultat à CloudFormation quoi qu'il arrive, en incluant
          # l'étape courante dans la raison : c'est ce texte qui apparaît dans
          # `ResourceStatusReason` côté CloudFormation.
          trap 'CODE=$?; echo "SORTIE code=$CODE etape=$STEP"; \
                /opt/aws/bin/cfn-signal -e $CODE --reason "etape=$STEP code=$CODE" \
                  --stack ${AWS::StackName} --resource Instance --region ${AWS::Region} || true' EXIT

          # `dnf update` n'est pas indispensable au premier démarrage : il
          # allonge le provisionnement de plusieurs minutes et peut dépasser le
          # délai de la `CreationPolicy`. Les paquets utiles sont installés
          # nommément juste après. Réactiver si l'on veut une AMI à jour.
          step "installation-des-paquets"
          # `install_weak_deps=False` économise ~18 Mio (nodejs22-docs et
          # nodejs22-full-i18n), inutiles au runtime et longs à télécharger.
          dnf install -y nginx nodejs22 --setopt=install_weak_deps=False \
            || { echo "ECHEC installation paquets"; exit 2; }

          step "preparation-cache-nginx"
          # `/var/cache/nginx` **n'existe pas** sur AL2023 : le paquet nginx ne
          # le crée pas, et `proxy_cache_path` ne le crée pas non plus de façon
          # fiable. Sans ce répertoire, `nginx -t` échoue avec :
          #   nginx: [emerg] mkdir() "/var/cache/nginx/editeur" failed
          #          (2: No such file or directory)
          # L'image `nginx:alpine` le fournit, ce qui masquait le défaut en test.
          mkdir -p /var/cache/nginx/editeur
          chown -R nginx:nginx /var/cache/nginx 2>/dev/null || chown -R nginx:root /var/cache/nginx
          chmod 700 /var/cache/nginx/editeur

          step "configuration-systeme"

          # --- Limites de descripteurs (12 000+ connexions WebSocket) ---------
          cat >/etc/security/limits.d/99-editeur.conf <<'EOF'
          *  soft  nofile  65536
          *  hard  nofile  65536
          EOF

          # --- nginx ---------------------------------------------------------
          cat >/etc/nginx/conf.d/editeur.conf <<'EOF'
          map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
          }

          server {
            listen 80 default_server;
            server_name _;
            root /opt/editeur/public;
            index index.html;

            # Fichiers du front statique : /doc?id=… doit trouver doc.html
            location / {
              try_files $uri $uri.html $uri/ =404;
            }

            # ------------------------------------------------------------------
            # Parcours visiteur : /d/{token}/{status,claim,file}
            #
            # Ces routes sont exposées par Fastify **à la racine**, pas sous
            # /api (voir `registerVisitorRoutes` dans backend/src/server/app.ts).
            # Seul `/status` était proxifié auparavant : `claim` et `file`
            # tombaient dans `location /` et renvoyaient 404 — le bouton
            # « Télécharger » et la réservation d'exemplaire étaient donc cassés
            # en production, alors que tous les tests locaux passaient (ils
            # interrogent Node directement, sans nginx).
            # ------------------------------------------------------------------
            location /d/ {
              proxy_pass http://127.0.0.1:3000;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 65s;
            }

            # Micro-cache de l'état public (C5/C6) : 1 s tant qu'actif,
            # 60 s une fois épuisé (via X-Accel-Expires renvoyé par Node).
            #
            # La regex porte sur `/d/…`, l'URL réellement appelée par le client
            # (`VISITOR_BASE` retire le suffixe `/api`). Une regex `^/api/d/…`
            # ne matchait jamais et laissait 15 000 visiteurs frapper Node.
            # Les locations par regex sont prioritaires sur le préfixe `/d/`.
            location ~ ^/d/[^/]+/status$ {
              proxy_pass http://127.0.0.1:3000;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header Connection "";
              proxy_cache MYCACHE;
              proxy_cache_valid 200 1s;
              # Une seule requête vers Node par clé, les autres attendent (C5).
              proxy_cache_lock on;
              proxy_cache_lock_timeout 2s;
              proxy_cache_use_stale error timeout updating;
              add_header X-Cache-Status $upstream_cache_status;
            }

            location /api/ {
              proxy_pass http://127.0.0.1:3000;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 65s;
            }

            location /ws {
              proxy_pass http://127.0.0.1:3000;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              proxy_set_header Host $host;
              proxy_read_timeout 3600s;
              proxy_send_timeout 3600s;
            }

            location /health {
              proxy_pass http://127.0.0.1:3000;
              proxy_set_header Host $host;
            }
          }

          EOF

          # nginx.conf complet : sans les blocs `events` et `http`, nginx refuse
          # de démarrer (`sendfile`, `keepalive_timeout` et `proxy_cache_path`
          # ne sont valides que dans `http`). Avec `set -e`, le reste du user
          # data s'arrêtait donc là et l'instance restait sans application.
          cat >/etc/nginx/nginx.conf <<'EOF'
          user nginx;
          worker_processes auto;
          worker_rlimit_nofile 65536;
          error_log /var/log/nginx/error.log warn;
          pid /run/nginx.pid;

          events {
            worker_connections 16384;
          }

          http {
            include /etc/nginx/mime.types;
            default_type application/octet-stream;
            sendfile on;
            keepalive_timeout 65;
            access_log /var/log/nginx/access.log;
            # AL2023 émet un avertissement `types_hash` avec les valeurs par
            # défaut ; on les relève, c'est gratuit et cela évite un warn à
            # chaque `nginx -t` et à chaque rechargement.
            types_hash_max_size 2048;
            types_hash_bucket_size 128;
            proxy_cache_path /var/cache/nginx/editeur levels=1:2 keys_zone=MYCACHE:10m max_size=200m inactive=10m use_temp_path=off;
            include /etc/nginx/conf.d/*.conf;
          }
          EOF

          # --- Application ---------------------------------------------------
          mkdir -p /opt/editeur /opt/editeur/public /var/log/editeur
          chown -R ec2-user:ec2-user /opt/editeur /var/log/editeur

          # Page d'attente : l'application réelle est poussée par deploy.sh
          cat >/opt/editeur/public/index.html <<'EOF'
          <!doctype html><html lang="fr"><head><meta charset="utf-8">
          <title>Éditeur de documents partagé</title></head>
          <body style="font-family:system-ui;padding:40px">
          <h1>Instance prête</h1>
          <p>Déployez l'application : <code>./scripts/deploy.sh</code></p>
          </body></html>
          EOF

          cat >/etc/systemd/system/editeur-app.service <<'EOF'
          [Unit]
          Description=Editeur de documents partage (Fastify + ws + Yjs)
          After=network-online.target

          [Service]
          Type=simple
          User=ec2-user
          WorkingDirectory=/opt/editeur
          EnvironmentFile=/opt/editeur/app.env
          ExecStart=/usr/bin/node /opt/editeur/dist/server/main.mjs
          Restart=always
          RestartSec=3
          LimitNOFILE=65536
          StandardOutput=append:/var/log/editeur/app.log
          StandardError=append:/var/log/editeur/app.log

          [Install]
          WantedBy=multi-user.target
          EOF

          cat >/etc/systemd/system/editeur-worker.service <<'EOF'
          [Unit]
          Description=Editeur - worker PDF (SQS)
          After=network-online.target editeur-app.service

          [Service]
          Type=simple
          User=ec2-user
          WorkingDirectory=/opt/editeur
          EnvironmentFile=/opt/editeur/app.env
          ExecStart=/usr/bin/node /opt/editeur/dist/server/worker.mjs
          Restart=always
          RestartSec=5
          StandardOutput=append:/var/log/editeur/worker.log
          StandardError=append:/var/log/editeur/worker.log

          [Install]
          WantedBy=multi-user.target
          EOF

          cat >/opt/editeur/app.env <<EOF
          APP_MODE=production
          AWS_REGION=${AWS::Region}
          PORT=3000
          HOST=127.0.0.1
          STATIC_DIR=/opt/editeur/public
          DOCUMENTS_TABLE=${DocumentsTable}
          MEMBERS_TABLE=${MembersTable}
          UPDATES_TABLE=${UpdatesTable}
          CREDITS_TABLE=${CreditsTable}
          OPIDS_TABLE=${OpIdsTable}
          ABUSE_TABLE=${AbuseTable}
          LINKS_TABLE=${LinksTable}
          TICKETS_TABLE=${TicketsTable}
          PDFCACHE_TABLE=${PdfCacheTable}
          VERSIONS_TABLE=${VersionsTable}
          BUCKET=${Bucket}
          PDF_QUEUE_URL=${PdfQueue}
          SES_SENDER=${SesSenderEmail}
          JWT_SECRET_PARAM=/editeur/jwt-secret
          ADMIN_KEY_PARAM=/editeur/admin-key
          CREDIT_PER_DAY=${CreditPerDay}
          MAX_UPDATE_BYTES=${MaxUpdateBytes}
          BATCH_MS=${BatchMs}
          TICK_MS=${TickMs}
          EOF
          chown ec2-user:ec2-user /opt/editeur/app.env

          step "demarrage-services"
          systemctl daemon-reload
          systemctl enable nginx editeur-app editeur-worker || true

          # `nginx -t` avant de démarrer : une configuration invalide produirait
          # un échec obscur, et la raison remontée à CloudFormation serait vide.
          if ! nginx -t; then
            echo "ECHEC : configuration nginx invalide"
            nginx -t || true
            exit 3
          fi
          systemctl start nginx || { echo "ECHEC : demarrage nginx"; exit 4; }
          echo "nginx demarre"

          step "installation-application"
          aws s3 cp "s3://${Bucket}/artifacts/app.tar.gz" /tmp/app.tar.gz --region ${AWS::Region} || echo "archive absente : en attente de deploy.sh"
          if [ -f /tmp/app.tar.gz ]; then
            tar -xzf /tmp/app.tar.gz -C /opt/editeur
            chown -R ec2-user:ec2-user /opt/editeur
            systemctl start editeur-app editeur-worker || { echo "ECHEC : demarrage editeur-app"; exit 5; }
          fi

          step "termine"
          echo "Initialisation reussie"

      Tags:
        - { Key: Projet, Value: editeur-documents-partage }
        - { Key: Proprietaire, Value: Djusse Tameno Christian }
        - { Key: Name, Value: editeur-app }

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  # ---------------------------------------------------------------------------
  # Journaux CloudWatch (rétention courte : coût maîtrisé)
  # ---------------------------------------------------------------------------
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /editeur/app
      RetentionInDays: 7
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

Outputs:
  PublicIp:
    Description: Elastic IP de l'application (URL stable pour le jury)
    Value: !Ref ElasticIp
  AppUrl:
    Description: URL de l'application (HTTP, sans domaine)
    Value: !Sub 'http://${ElasticIp}'
  InstanceId:
    Description: Identifiant de l'instance (SSM, redéploiement)
    Value: !Ref Instance
  BucketName:
    Description: Bucket S3 des PDF, snapshots et artefacts
    Value: !Ref Bucket
  PdfQueueUrl:
    Description: URL de la file SQS des PDF
    Value: !Ref PdfQueue
  AdminKeyParameter:
    Description: Paramètre SSM de la clé d'administration
    Value: /editeur/admin-key
