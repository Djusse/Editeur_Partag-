AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Éditeur de documents partagé — une instance EC2 (Node.js : Fastify + ws + Yjs)
  derrière nginx, DynamoDB, S3 privé, SQS + file de lettres mortes, SES et
  SSM Parameter Store. Région imposée par le compte : eu-north-1 (Stockholm).

Metadata:
  Projet: editeur-documents-partage
  Proprietaire: Djusse Tameno Christian

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Paire de clés SSH existante (créée à la phase 0).
  AdminCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: >
      Plage autorisée pour SSH (port 22). Mettre votre IP en /32.
      Laisser 0.0.0.0/0 si vous utilisez uniquement Session Manager.
  InstanceType:
    Type: String
    Default: t3.large
    AllowedValues: [t3.medium, t3.large, t3.xlarge]
    Description: t3.large = 2 vCPU / 8 Gio, crédits CPU en mode Standard.
  SesSenderEmail:
    Type: String
    Description: Adresse expéditrice vérifiée dans SES (Gmail vérifié).
  AppArchiveUrl:
    Type: String
    Default: ''
    Description: >
      URL S3 de l'archive de l'application (build + front). Vide au premier
      déploiement : l'instance démarre alors avec une page d'attente, et
      scripts/deploy.sh pousse l'application par SSM.
  CreditPerDay:
    Type: Number
    Default: 10000
  MaxUpdateBytes:
    Type: Number
    Default: 65536
  BatchMs:
    Type: Number
    Default: 300
  TickMs:
    Type: Number
    Default: 250

Resources:

  # ---------------------------------------------------------------------------
  # Stockage objet : PDF, snapshots, versions, artefacts de déploiement
  # ---------------------------------------------------------------------------
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub 'editeur-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-artefacts
            Status: Enabled
            Prefix: artifacts/
            ExpirationInDays: 7
          - Id: expire-pdf
            Status: Enabled
            Prefix: pdf/
            ExpirationInDays: 30
      Tags:
        - { Key: Projet, Value: editeur-documents-partage }

  # Refuse tout trafic non HTTPS (accès public déjà bloqué, ceinture et bretelles)
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt Bucket.Arn
              - !Sub '${Bucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # ---------------------------------------------------------------------------
  # Tables DynamoDB (mode à la demande)
  # ---------------------------------------------------------------------------
  DocumentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: docId, AttributeType: S }
      KeySchema:
        - { AttributeName: docId, KeyType: HASH }
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  MembersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: docId, AttributeType: S }
        - { AttributeName: email, AttributeType: S }
      KeySchema:
        - { AttributeName: docId, KeyType: HASH }
        - { AttributeName: email, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - { AttributeName: email, KeyType: HASH }
          Projection: { ProjectionType: ALL }
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  UpdatesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: docId, AttributeType: S }
        - { AttributeName: seq, AttributeType: N }
      KeySchema:
        - { AttributeName: docId, KeyType: HASH }
        - { AttributeName: seq, KeyType: RANGE }
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  CreditsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  OpIdsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  AbuseTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  LinksTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: token, AttributeType: S }
        - { AttributeName: docId, AttributeType: S }
      KeySchema:
        - { AttributeName: token, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: docId-index
          KeySchema:
            - { AttributeName: docId, KeyType: HASH }
          Projection: { ProjectionType: ALL }
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  TicketsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: token, AttributeType: S }
        - { AttributeName: visitorId, AttributeType: S }
      KeySchema:
        - { AttributeName: token, KeyType: HASH }
        - { AttributeName: visitorId, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  PdfCacheTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  VersionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: docId, AttributeType: S }
        - { AttributeName: n, AttributeType: N }
      KeySchema:
        - { AttributeName: docId, KeyType: HASH }
        - { AttributeName: n, KeyType: RANGE }
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  # ---------------------------------------------------------------------------
  # File SQS des PDF + file de lettres mortes
  # ---------------------------------------------------------------------------
  PdfDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: editeur-pdf-dlq
      MessageRetentionPeriod: 1209600
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  PdfQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: editeur-pdf
      # Un consommateur lent ne doit pas être tué trop vite : la génération d'un
      # gros PDF peut prendre plusieurs dizaines de secondes.
      VisibilityTimeout: 120
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PdfDeadLetterQueue.Arn
        maxReceiveCount: 3
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]
# Les secrets (`/editeur/jwt-secret`, `/editeur/admin-key`) ne sont **pas**
# créés par ce template : `scripts/deploy.sh` les génère avec `openssl rand`
# puis les écrit en `SecureString`. Ils n'existent donc ni dans le dépôt, ni
# dans l'historique CloudFormation, ni dans le user data.

  # ---------------------------------------------------------------------------
  # Réseau : Security Group, rôle d'instance
  # ---------------------------------------------------------------------------
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Editeur documents partage - HTTP public, SSH restreint
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP (REST et WebSocket)
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
          Description: SSH limite
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: Sortie libre (DynamoDB, S3, SQS, SES, SSM)
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: editeur-moindre-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DynamoDB
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt DocumentsTable.Arn
                  - !GetAtt MembersTable.Arn
                  - !Sub '${MembersTable.Arn}/index/*'
                  - !GetAtt UpdatesTable.Arn
                  - !GetAtt CreditsTable.Arn
                  - !GetAtt OpIdsTable.Arn
                  - !GetAtt AbuseTable.Arn
                  - !GetAtt LinksTable.Arn
                  - !Sub '${LinksTable.Arn}/index/*'
                  - !GetAtt TicketsTable.Arn
                  - !GetAtt PdfCacheTable.Arn
                  - !GetAtt VersionsTable.Arn
              - Sid: S3ListBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
              - Sid: S3Objects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${Bucket.Arn}/*'
              - Sid: SQS
                Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueAttributes
                Resource:
                  - !GetAtt PdfQueue.Arn
                  - !GetAtt PdfDeadLetterQueue.Arn
              - Sid: SSEmail
                Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'
                Condition:
                  StringEquals:
                    ses:FromAddress: !Ref SesSenderEmail
              - Sid: SSMParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/editeur/*'
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/editeur/*'
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # ---------------------------------------------------------------------------
  # Instance applicative
  # ---------------------------------------------------------------------------
  Instance:
    Type: AWS::EC2::Instance
    # Pas de secret dans le user data : il est lisible via les métadonnées.
    # Les secrets vivent dans SSM et sont lus par le rôle d'instance.
    Properties:
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!Ref SecurityGroup]
      Monitoring: true
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2
        HttpEndpoint: enabled
      CreditSpecification:
        CPUCredits: standard
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf update -y
          dnf install -y nginx nodejs22 amazon-cloudwatch-agent

          # --- Limites de descripteurs (12 000+ connexions WebSocket) ---------
          cat >/etc/security/limits.d/99-editeur.conf <<'EOF'
          *  soft  nofile  65536
          *  hard  nofile  65536
          EOF

          # --- nginx ---------------------------------------------------------
          cat >/etc/nginx/conf.d/editeur.conf <<'EOF'
          map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
          }

          server {
            listen 80 default_server;
            server_name _;
            root /opt/editeur/public;
            index index.html;

            # Fichiers du front statique : /doc?id=… doit trouver doc.html
            location / {
              try_files $uri $uri.html $uri/ =404;
            }

            # Micro-cache de l'état public (C5/C6) : 1 s tant qu'actif,
            # 60 s une fois épuisé (via X-Accel-Expires renvoyé par Node).
            location ~ ^/d/[^/]+/status$ {
              proxy_pass http://127.0.0.1:3000;
              proxy_set_header Host $host;
              proxy_cache MYCACHE;
              proxy_cache_valid 200 1s;
              proxy_cache_use_stale error timeout updating;
              add_header X-Cache-Status $upstream_cache_status;
            }

            location /api/ {
              proxy_pass http://127.0.0.1:3000;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 65s;
            }

            location /ws {
              proxy_pass http://127.0.0.1:3000;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              proxy_set_header Host $host;
              proxy_read_timeout 3600s;
              proxy_send_timeout 3600s;
            }

            location /health {
              proxy_pass http://127.0.0.1:3000;
            }
          }

          proxy_cache_path /var/cache/nginx/editeur levels=1:2 keys_zone=MYCACHE:10m max_size=200m inactive=10m use_temp_path=off;
          EOF

          cat >/etc/nginx/nginx.conf <<'EOF'
          user nginx;
          worker_processes auto;
          worker_rlimit_nofile 65536;
          error_log /var/log/nginx/error.log warn;
          pid /run/nginx.pid;
          include /etc/nginx/mime.types;
          default_type application/octet-stream;
          sendfile on;
          keepalive_timeout 65;
          include /etc/nginx/conf.d/*.conf;
          EOF

          # --- Application ---------------------------------------------------
          mkdir -p /opt/editeur /opt/editeur/public /var/log/editeur
          chown -R ec2-user:ec2-user /opt/editeur /var/log/editeur

          # Page d'attente : l'application réelle est poussée par deploy.sh
          cat >/opt/editeur/public/index.html <<'EOF'
          <!doctype html><html lang="fr"><head><meta charset="utf-8">
          <title>Éditeur de documents partagé</title></head>
          <body style="font-family:system-ui;padding:40px">
          <h1>Instance prête</h1>
          <p>Déployez l'application : <code>./scripts/deploy.sh</code></p>
          </body></html>
          EOF

          cat >/etc/systemd/system/editeur-app.service <<'EOF'
          [Unit]
          Description=Editeur de documents partage (Fastify + ws + Yjs)
          After=network-online.target

          [Service]
          Type=simple
          User=ec2-user
          WorkingDirectory=/opt/editeur
          EnvironmentFile=/opt/editeur/app.env
          ExecStart=/usr/bin/node /opt/editeur/dist/server/main.mjs
          Restart=always
          RestartSec=3
          LimitNOFILE=65536
          StandardOutput=append:/var/log/editeur/app.log
          StandardError=append:/var/log/editeur/app.log

          [Install]
          WantedBy=multi-user.target
          EOF

          cat >/etc/systemd/system/editeur-worker.service <<'EOF'
          [Unit]
          Description=Editeur - worker PDF (SQS)
          After=network-online.target editeur-app.service

          [Service]
          Type=simple
          User=ec2-user
          WorkingDirectory=/opt/editeur
          EnvironmentFile=/opt/editeur/app.env
          ExecStart=/usr/bin/node /opt/editeur/dist/server/worker.mjs
          Restart=always
          RestartSec=5
          StandardOutput=append:/var/log/editeur/worker.log
          StandardError=append:/var/log/editeur/worker.log

          [Install]
          WantedBy=multi-user.target
          EOF

          cat >/opt/editeur/app.env <<EOF
          APP_MODE=production
          AWS_REGION=${AWS::Region}
          PORT=3000
          HOST=127.0.0.1
          STATIC_DIR=/opt/editeur/public
          DOCUMENTS_TABLE=${DocumentsTable}
          MEMBERS_TABLE=${MembersTable}
          UPDATES_TABLE=${UpdatesTable}
          CREDITS_TABLE=${CreditsTable}
          OPIDS_TABLE=${OpIdsTable}
          ABUSE_TABLE=${AbuseTable}
          LINKS_TABLE=${LinksTable}
          TICKETS_TABLE=${TicketsTable}
          PDFCACHE_TABLE=${PdfCacheTable}
          VERSIONS_TABLE=${VersionsTable}
          BUCKET=${Bucket}
          PDF_QUEUE_URL=${PdfQueue}
          SES_SENDER=${SesSenderEmail}
          JWT_SECRET_PARAM=/editeur/jwt-secret
          ADMIN_KEY_PARAM=/editeur/admin-key
          CREDIT_PER_DAY=${CreditPerDay}
          MAX_UPDATE_BYTES=${MaxUpdateBytes}
          BATCH_MS=${BatchMs}
          TICK_MS=${TickMs}
          EOF
          chown ec2-user:ec2-user /opt/editeur/app.env

          systemctl daemon-reload
          systemctl enable nginx editeur-app editeur-worker || true
          systemctl start nginx

          aws s3 cp "s3://${Bucket}/artifacts/app.tar.gz" /tmp/app.tar.gz --region ${AWS::Region} || echo "archive absente : en attente de deploy.sh"
          if [ -f /tmp/app.tar.gz ]; then
            tar -xzf /tmp/app.tar.gz -C /opt/editeur
            chown -R ec2-user:ec2-user /opt/editeur
            systemctl start editeur-app editeur-worker
          fi

      Tags:
        - { Key: Projet, Value: editeur-documents-partage }
        - { Key: Name, Value: editeur-app }

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

  # ---------------------------------------------------------------------------
  # Journaux CloudWatch (rétention courte : coût maîtrisé)
  # ---------------------------------------------------------------------------
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /editeur/app
      RetentionInDays: 7
      Tags: [{ Key: Projet, Value: editeur-documents-partage }]

Outputs:
  PublicIp:
    Description: Elastic IP de l'application (URL stable pour le jury)
    Value: !Ref ElasticIp
  AppUrl:
    Description: URL de l'application (HTTP, sans domaine)
    Value: !Sub 'http://${ElasticIp}'
  InstanceId:
    Description: Identifiant de l'instance (SSM, redéploiement)
    Value: !Ref Instance
  BucketName:
    Description: Bucket S3 des PDF, snapshots et artefacts
    Value: !Ref Bucket
  PdfQueueUrl:
    Description: URL de la file SQS des PDF
    Value: !Ref PdfQueue
  AdminKeyParameter:
    Description: Paramètre SSM de la clé d'administration
    Value: /editeur/admin-key
