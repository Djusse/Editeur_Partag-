openapi: 3.0.3
info:
  title: Éditeur de documents partagé — API
  version: 2.0.0
  description: |
    API servie par Node.js (Fastify) sur une instance EC2, derrière nginx.

    - Les routes du **rédacteur** sont préfixées par `/api` et exigent
      `Authorization: Bearer <JWT>`.
    - Le **parcours visiteur** est à la racine (`/d/...`) : aucune identité, et
      les états `202` et `410` sont des réponses **normales**, pas des erreurs.
    - Les erreurs applicatives ont la forme `{error: "CODE", field?}`.

    **Réponses visiteur normalisées** : `ready` (200 + URL présignée 60 s) ·
    `waiting` (202 + `retryAfter`) · `exhausted` (410). Aucun autre état n'est
    produit pour un parcours normal.
servers:
  - url: http://{elasticIp}
    variables:
      elasticIp:
        default: 13.53.100.20
security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: État du service (supervision, vérification de déploiement)
      security: []
      responses:
        '200':
          description: Service en vie
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  uptime: { type: integer, description: Secondes depuis le démarrage }
                  mode: { type: string, enum: [production, local] }

  /api/config:
    get:
      summary: Réglages publics (aucun secret)
      security: []
      responses:
        '200':
          description: Valeurs utiles au client
          content:
            application/json:
              schema:
                type: object
                properties:
                  batchMs: { type: integer, example: 300 }
                  creditPerDay: { type: integer, example: 10000 }
                  maxUpdateBytes: { type: integer, example: 65536 }
                  wsTicketTtlSeconds: { type: integer, example: 60 }

  /api/session:
    post:
      summary: Ouvrir une session (nom + e-mail → JWT)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string, maxLength: 60, example: Awa Nkemta }
                email: { type: string, format: email, maxLength: 254, example: awa@exemple.cm }
      responses:
        '200':
          description: Session créée
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: JWT HS256, durée 7 jours }
                  user:
                    type: object
                    properties:
                      name: { type: string }
                      email: { type: string }
                  credit: { $ref: '#/components/schemas/Credit' }
        '400':
          description: Entrée invalide (`INVALID_INPUT`, champ `field`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/ws-ticket:
    post:
      summary: Ticket à usage unique (60 s) pour ouvrir le WebSocket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentId]
              properties:
                documentId: { type: string }
      responses:
        '201':
          description: Ticket émis (une connexion acceptée, jamais deux)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { type: string }
                  expiresIn: { type: integer, example: 60 }
                  documentId: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/documents:
    get:
      summary: Lister les documents accessibles au rédacteur
      responses:
        '200':
          description: Du plus récemment modifié au plus ancien
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items: { $ref: '#/components/schemas/DocumentSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Créer un document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201':
          description: Document créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, example: doc_ab12cd34 }
                  title: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/documents/{id}:
    parameters:
      - $ref: '#/components/parameters/DocId'
    get:
      summary: Détail d'un document et liste des membres
      responses:
        '200':
          description: Détail
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  title: { type: string }
                  ownerEmail: { type: string }
                  ownerName: { type: string }
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/documents/{id}/state:
    parameters:
      - $ref: '#/components/parameters/DocId'
    get:
      summary: État Yjs complet (Base64) et séquence courante
      description: |
        Point de départ de la synchronisation. L'interface applique cet état au
        `Y.Doc`, rejoue localement les `pendingOps`, puis envoie
        `join {sinceSeq: seq}`.
      responses:
        '200':
          description: État encodé par `Y.encodeStateAsUpdate`
          content:
            application/json:
              schema:
                type: object
                properties:
                  seq: { type: integer, description: Dernier journal écrit }
                  state: { type: string, description: État Yjs complet en Base64 }

  /api/documents/{id}/members:
    parameters:
      - $ref: '#/components/parameters/DocId'
    post:
      summary: Donner accès à un rédacteur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Liste des membres à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
        '409':
          description: Déjà membre (`ALREADY_MEMBER`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/documents/{id}/updates:
    parameters:
      - $ref: '#/components/parameters/DocId'
    post:
      summary: Publier un update (repli HTTP du WebSocket)
      description: 'Mêmes règles que le WebSocket : même transaction, même crédit.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opId, update]
              properties:
                opId: { type: string, maxLength: 100 }
                update: { type: string, description: Update Yjs en Base64 (≤ 64 Ko de binaire) }
      responses:
        '200':
          description: Update accepté ou déjà accepté (idempotent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ack:
                    type: object
                    properties:
                      opIds: { type: array, items: { type: string } }
                      seq: { type: integer }
                      creditRemaining: { type: integer }
        '403':
          description: Crédit épuisé ou écriture bloquée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Update trop volumineux (`PAYLOAD_TOO_LARGE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      parameters:
        - name: since
          in: query
          schema: { type: integer, default: 0 }
          description: Renvoie les updates de `seq` strictement supérieur
      summary: Rattrapage après reconnexion
      responses:
        '200':
          description: Updates manquants, ordonnés par `seq`
          content:
            application/json:
              schema:
                type: object
                properties:
                  updates:
                    type: array
                    items:
                      type: object
                      properties:
                        seq: { type: integer }
                        payload: { type: string }

  /api/documents/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/DocId'
    get:
      summary: Historique des versions
      description: |
        Les versions sont créées **automatiquement** (50 entrées de journal ou
        2 minutes d'activité). L'interface n'expose aucun bouton de création.
      responses:
        '200':
          description: De la plus récente à la plus ancienne
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items: { $ref: '#/components/schemas/Version' }

  /api/documents/{id}/versions/{n}/restore:
    parameters:
      - $ref: '#/components/parameters/DocId'
      - name: n
        in: path
        required: true
        schema: { type: integer }
    post:
      summary: Restaurer une version (gratuit)
      description: |
        Le serveur enregistre **d'abord** un snapshot du texte courant, puis
        applique un nouvel update qui remplace le texte. L'historique est
        conservé et aucun crédit n'est débité.
      responses:
        '200':
          description: Restauration appliquée
          content:
            application/json:
              schema:
                type: object
                properties:
                  seq: { type: integer }

  /api/documents/{id}/links:
    parameters:
      - $ref: '#/components/parameters/DocId'
    post:
      summary: Créer un lien de téléchargement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [maxDownloads]
              properties:
                maxDownloads: { type: integer, minimum: 1, maximum: 100000, example: 500 }
      responses:
        '201':
          description: Lien créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
        '400':
          description: Quota invalide (`INVALID_INPUT`, champ `maxDownloads`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      summary: Lister les liens du document (modale « Liens »)
      responses:
        '200':
          description: Du plus récent au plus ancien
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: array
                    items: { $ref: '#/components/schemas/Link' }

  /api/me/credit:
    get:
      summary: Crédit restant du jour et état de blocage
      responses:
        '200':
          description: Crédit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credit' }

  /d/{token}/status:
    parameters:
      - $ref: '#/components/parameters/Token'
    get:
      summary: État public du lien (micro-cache nginx)
      security: []
      responses:
        '200':
          description: État du lien
          headers:
            Cache-Control:
              schema: { type: string }
              description: 1 s tant qu'ACTIVE, 60 s une fois EXHAUSTED
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [active, exhausted] }
                  title: { type: string, description: Titre du document (page visiteur) }
                  remaining: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }

  /d/{token}/claim:
    parameters:
      - $ref: '#/components/parameters/Token'
    post:
      summary: Réserver un exemplaire (idempotent par `visitorId`)
      description: |
        **Ordre imposé** : le ticket du `visitorId` est cherché **avant** le
        court-circuit `exhausted`. Un visiteur qui a déjà son exemplaire ne
        reçoit donc jamais `410`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitorId]
              properties:
                visitorId: { type: string, minLength: 8, maxLength: 100 }
      responses:
        '200':
          description: PDF prêt
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, enum: [ready] }
                  url: { type: string, description: URL S3 présignée, expire en 60 s }
                  expiresIn: { type: integer, example: 60 }
        '202':
          description: Génération en cours — le visiteur patiente
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, enum: [waiting] }
                  retryAfter: { type: integer, example: 2 }
        '410':
          description: Lien épuisé — plus aucun travail effectué
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, enum: [exhausted] }
        '404': { $ref: '#/components/responses/NotFound' }

  /d/{token}/file:
    parameters:
      - $ref: '#/components/parameters/Token'
      - name: visitorId
        in: query
        required: true
        schema: { type: string }
    get:
      summary: Récupérer l'URL du PDF réservé (polling)
      security: []
      responses:
        '200': { description: PDF prêt (même corps que claim `ready`) }
        '202': { description: Toujours en génération }
        '410':
          description: Aucun ticket pour ce visiteur (`NO_TICKET`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/admin/state:
    get:
      summary: État de l'application (clé d'administration)
      description: |
        En-tête `X-Admin-Key` obligatoire. La valeur est le paramètre SSM
        `/editeur/admin-key`. La clé n'est jamais stockée côté navigateur.
      parameters:
        - name: X-Admin-Key
          in: header
          required: true
          schema: { type: string }
      security: []
      responses:
        '200':
          description: Trois blocs (documents ouverts, liens actifs, bloqués)
          content:
            application/json:
              schema:
                type: object
                properties:
                  openDocuments:
                    type: array
                    items:
                      type: object
                      properties:
                        docId: { type: string }
                        title: { type: string }
                        connections: { type: integer }
                  activeLinks:
                    type: array
                    items:
                      type: object
                      properties:
                        token: { type: string }
                        docId: { type: string }
                        title: { type: string }
                        maxDownloads: { type: integer }
                        remaining: { type: integer }
                  blocked:
                    type: array
                    items:
                      type: object
                      properties:
                        email: { type: string }
                        blockedUntil: { type: string, format: date-time }
        '401':
          description: Clé absente ou invalide
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    DocId:
      name: id
      in: path
      required: true
      schema: { type: string, example: doc_ab12cd34 }
    Token:
      name: token
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Entrée invalide
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Session absente ou expirée
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Accès refusé
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Code stable
          enum:
            - INVALID_INPUT
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - ALREADY_MEMBER
            - PAYLOAD_TOO_LARGE
            - CREDIT_EXHAUSTED
            - BLOCKED
            - NO_TICKET
            - PDF_UNAVAILABLE
            - INTERNAL_ERROR
        message: { type: string }
        field: { type: string, description: Champ fautif pour INVALID_INPUT }
        blockedUntil: { type: string, format: date-time }
        creditRemaining: { type: integer }
    DocumentSummary:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        ownerName: { type: string }
        ownerEmail: { type: string }
        updatedAt: { type: string, format: date-time }
        role: { type: string, enum: [owner, editor] }
    Member:
      type: object
      properties:
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, editor] }
    Link:
      type: object
      properties:
        token: { type: string }
        maxDownloads: { type: integer }
        remaining: { type: integer }
        status: { type: string, enum: [ACTIVE, EXHAUSTED] }
        createdAt: { type: string, format: date-time }
    Version:
      type: object
      properties:
        n: { type: integer, description: Séquence figée du snapshot }
        createdAt: { type: string, format: date-time }
        authorName: { type: string }
        chars: { type: integer }
    Credit:
      type: object
      properties:
        limit: { type: integer, example: 10000 }
        used: { type: integer }
        remaining: { type: integer }
        day: { type: string, example: '2026-10-25' }
        blockedUntil:
          type: string
          nullable: true
          format: date-time
          description: '`null` si le rédacteur n''est pas bloqué'
        resetsAt:
          type: string
          format: date-time
          description: Prochain minuit UTC (instant de recharge)
        resetsIn: { type: integer, description: Secondes avant la recharge }
